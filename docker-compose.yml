version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: resume_agent_postgres
    environment:
      POSTGRES_USER: resume_agent
      POSTGRES_PASSWORD: resume_agent_pass
      POSTGRES_DB: resume_agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

