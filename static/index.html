<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Agent 可视化调试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .json-block {
            background-color: #f9fafb;
            border-left: 2px solid #d1d5db;
            padding: 0.5rem;
            border-radius: 0.25rem;
            font-family: monospace;
            white-space: pre-wrap;
            margin: 0.25rem 0;
            font-size: 0.7rem;
            color: #6b7280;
            opacity: 0.7;
        }
        .debug-info {
            font-size: 0.65rem;
            color: #9ca3af;
            margin-top: 0.25rem;
            font-style: italic;
            opacity: 0.8;
        }
        .log-message {
            font-size: 0.75rem;
            color: #4b5563;
            opacity: 1;
            border-left: 2px solid #6366f1;
            padding: 0.5rem 0.75rem;
            margin: 0.5rem 0;
            background-color: #f3f4f6;
            border-radius: 0.25rem;
        }
        .timer-log {
            font-size: 0.75rem;
            color: #4f46e5;
            font-weight: 500;
            border-top: 1px solid #e5e7eb;
            padding-top: 0.75rem;
            margin-top: 0.75rem;
        }
        .message-user {
            background-color: #e0e7ff;
            align-self: flex-end;
            white-space: pre-wrap;
        }
        .message-agent {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            align-self: flex-start;
            white-space: pre-wrap;
        }
        .session-item {
            transition: all 0.2s;
        }
        .session-item:hover {
            background-color: #f3f4f6;
        }
        .session-item.active {
            background-color: #eef2ff;
            border-left: 3px solid #4f46e5;
        }
        .edit-session-name-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .edit-session-name-btn:hover {
            transform: scale(1.1);
        }
        .edit-session-name-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                left: -100%;
                z-index: 50;
                height: 100vh;
            }
            #sidebar.open {
                left: 0;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideDown {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-80 bg-white border-r border-gray-200 flex flex-col h-screen transition-all duration-300">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-gray-200">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-bold text-gray-800">会话列表</h2>
                <button id="sidebar-toggle" class="md:hidden text-gray-500 hover:text-gray-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="flex space-x-2">
                <button id="new-session-btn" 
                    class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition text-sm font-medium">
                    + 新建会话
                </button>
                <button id="refresh-btn" 
                    class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition text-sm font-medium"
                    title="刷新当前会话的统计信息">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Session List -->
        <div id="session-list" class="flex-1 overflow-y-auto p-2 min-h-0">
            <!-- Sessions will be dynamically added here -->
        </div>
        
        <!-- Todo List (Pending Questions) -->
        <div id="todo-container" class="bg-amber-50 border-t border-amber-200 flex flex-col hidden" style="max-height: 40%; min-height: 200px;">
            <div class="p-3 border-b border-amber-200 flex-shrink-0">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-amber-800 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                        </svg>
                        待办事项
                    </h3>
                    <button id="todo-toggle" class="text-amber-600 hover:text-amber-800 text-xs flex items-center">
                        <span id="todo-toggle-text">收起</span>
                        <svg class="w-4 h-4 inline-block ml-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <ul id="todo-list" class="flex-1 overflow-y-auto p-2 space-y-2 text-sm text-amber-900 min-h-0">
                <!-- Todo items will be dynamically added here -->
            </ul>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm p-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button id="sidebar-toggle-mobile" class="md:hidden text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                        <h1 class="text-xl font-bold text-gray-800">Resume Agent 可视化调试终端</h1>
                    </div>
                    <button type="button" id="edit-session-name-btn" 
                            class="flex items-center gap-2 px-3 py-1.5 text-sm text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all cursor-pointer"
                            title="编辑会话名称">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                        <span>编辑会话名称</span>
                    </button>
                </div>
                <div class="block mt-2">
                    <div class="inline-block space-x-2">
                        <input type="text" id="session-id-input" 
                            class="border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64"
                            placeholder="输入或粘贴 session_id" readonly disabled>
                    </div>
                    <div class="inline-block space-x-2 ml-10">
                        <label for="agent-select" class="text-sm text-gray-600">選擇 Agent:</label>
                        <select id="agent-select" 
                            class="border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="planner_worker">經典架構 (Planner-Worker)</option>
                            <option value="dual_track">雙軌架構 (Dual Track)</option>
                        </select>
                    </div>
                   
                </div>
        </header>

        <!-- Chat Container -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4">
            <!-- Messages will appear here -->
        </main>

        <!-- Input Area -->
        <footer class="bg-white border-t p-4">
            <div class="max-w-4xl mx-auto flex space-x-4">
                <input type="text" id="user-input" 
                    class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                    placeholder="输入消息，例如：我在字节跳动做过后端开发...">
                <button id="send-btn" 
                    class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                    发送
                </button>
            </div>
        </footer>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
